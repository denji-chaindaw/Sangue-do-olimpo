
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Descompactar projeto
        run: |
          test -f limiar_android.zip || { echo "Falta o arquivo limiar_android.zip na raiz do repositorio"; exit 1; }
          unzip -q limiar_android.zip -d game
          ls game

      - name: Instalar Godot e templates Android
        run: |
          set -e
          cd "$RUNNER_TEMP"
          V="$GODOT_VERSION"
          get() {
            for base in "https://github.com/godotengine/godot-builds/releases/download/${V}-stable" "https://github.com/godotengine/godot/releases/download/${V}-stable"; do
              wget -q "$base/$1" && return 0
            done
            echo "Nao consegui baixar $1"; return 1
          }
          get "Godot_v${V}-stable_linux.x86_64.zip"
          get "Godot_v${V}-stable_export_templates.tpz"
          unzip -q "Godot_v${V}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${V}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          unzip -q "Godot_v${V}-stable_export_templates.tpz" "templates/android*" "templates/version.txt" -d tpl
          mkdir -p "$HOME/.local/share/godot/export_templates/${V}.stable"
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${V}.stable/"
          ls "$HOME/.local/share/godot/export_templates/${V}.stable/"

      - name: Instalar Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sudo chown -R "$USER" "$SDK" || true
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Configurar Godot para Android
        run: |
          set -e
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          TRES
          sed -i 's/^ *//' "$HOME/.config/godot/editor_settings-4.tres"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Ajustar projeto para Android
        run: |
          sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' game/project.godot
          cat game/project.godot

      - name: Importar assets
        run: |
          godot --headless --path game --import 2>&1 | tee import.log || true

      - name: Exportar APK
        run: |
          mkdir -p game/build
          godot --headless --path game --export-debug "Android" build/limiar-do-olimpo.apk 2>&1 | tee export.log
          ls -la game/build
          test -f game/build/limiar-do-olimpo.apk

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: limiar-do-olimpo-apk
          path: game/build/limiar-do-olimpo.apk

      - name: Publicar em Releases (link direto no celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" game/build/limiar-do-olimpo.apk --title "APK build ${{ github.run_number }}" --notes "Limiar do Olimpo - APK de teste (debug)."

      - name: Mostrar erros do Godot
        if: failure()
        run: |
          cat import.log export.log 2>/dev/null | grep -i -E "error|invalid|missing|cannot|requires|failed|not found" | head -15 | while IFS= read -r l; do echo "::error::${l:0:300}"; done

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            import.log
            export.log
          if-no-files-found: ignore
